<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Interaction UI</title>
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/typography.css">
    <link rel="stylesheet" href="css/base/layout.css">

    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/chat.css">
    <link rel="stylesheet" href="css/components/input.css">
    <link rel="stylesheet" href="css/components/config-panel.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/selectable.css">

    <link rel="stylesheet" href="css/utilities/markdown.css">
    <link rel="stylesheet" href="css/utilities/tooltips.css">

    <link rel="stylesheet" href="css/theme/dark.css">
    <link rel="stylesheet" href="css/responsive/media.css">
    <!-- Markdown parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/5.1.1/marked.min.js"></script>
    <!-- Marked highlight extension -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked-highlight/2.0.1/index.umd.min.js"></script>

    <!-- Syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <!-- Prism CSS for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://js.puter.com/v2/"></script>
    <script type="module" src="js/script.js" defer></script>
    <script type="module" src="js/puterConfig.js" defer></script>
    <script type="module" src="js/textFormat.js" defer></script>
    <script type="module" src="js/audioFormat.js" defer></script>
    <script type="module" src="js/imageFormat.js" defer></script>
    <script src="js/modelConfig.ts" defer></script>

</head>
<div class="main-container">
    <!-- Left Side: Model Configuration -->
    <aside class="config-panel">
        <div class="config-header">
            <h2>Model Configuration</h2>
            <button id="config-toggle-btn" class="config-toggle-btn">
                <span class="icon">◀</span>
            </button>
        </div>

        <div class="config-content">

            <div class="form-group" data-tooltip="Capabilities">
                <label for="capabilities">Select Capabilities:</label>
                <select id="capabilities" class="capabilities" multiple>
                    <!-- Select Model Capabilities -->
                </select>
            </div>
            <div class="form-group" data-tooltip="Platform">
                <label for="platform-select">Platform:</label>
                <select id="platform-select">
                    <option value="">-- Select a Platform --</option>
                </select>
            </div>
            <div class="form-group" data-tooltip="Models">
                <label for="model-list">Available Models:</label>
                <ul id="model-list" class="model-list">
                    <!-- Models will be populated dynamically -->
                </ul>
            </div>

            <!-- <div class="form-group">
            <label for="temperature-input">Temperature:</label>
            <input type="range" id="temperature-input" min="0" max="2" step="0.1" value="0.7" />
            <span id="temperature-value">0.7</span>
          </div> -->

            <!-- <div class="form-group">
            <label for="max-tokens-input">Max Tokens:</label>
            <input type="number" id="max-tokens-input" value="150" min="1" max="4000" />
          </div>
        </div> -->
    </aside>

    <!-- Right Side: Chat Interface -->
    <div class="chat-section">
        <header class="header">
            <h1>LLM Playground</h1>
            <button id="theme-toggle" class="theme-toggle-btn">🌙</button>
        </header>

        <div class="response-display" id="response-display">
            Response will appear here...
        </div>

        <div class="input-section">
            <!-- <div class="file-upload-section">
                <label for="file-input">📎</label>
                <input type="file" id="file-input" multiple />
                <button id="record-btn">🎙 Record</button>
                <p id="recording-status"></p>
            </div> -->

            <div class="input-container">
                <textarea id="prompt-input" placeholder="Type your message here..." rows="1"></textarea>

                <div class="send-buttons">
                    <button id="submit-btn" class="btn btn-primary">Send</button>
                    <!-- <button id="image-btn" class="btn btn-secondary">Image</button> -->
                    <button id="speech-btn" class="btn btn-speech">🎙 Speech</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
