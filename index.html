<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>LLM Playground</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
        try {
            const theme = JSON.parse(localStorage.getItem("llm-ui:theme"));
            if (theme) document.documentElement.setAttribute("data-theme", theme);
        } catch { }
    </script>

    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/tokens.css">
    <link rel="stylesheet" href="css/base/typography.css">
    <link rel="stylesheet" href="css/base/layout.css">

    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/config-panel.css">
    <link rel="stylesheet" href="css/components/chat.css">
    <link rel="stylesheet" href="css/components/input.css">

    <link rel="stylesheet" href="css/utilities/markdown.css">
    <link rel="stylesheet" href="css/responsive/media.css">

    <!-- Markdown parser + sanitiser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/5.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

    <!-- Syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <script src="https://js.puter.com/v2/"></script>
    <script type="module" src="js/script.js"></script>
</head>

<body>
    <div class="app">
        <!-- Sidebar: model configuration -->
        <aside class="sidebar" id="sidebar" aria-label="Model configuration">
            <div class="sidebar-header">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" />
                            <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" />
                        </svg>
                    </span>
                    <span class="brand-name">LLM Playground</span>
                </div>
                <button type="button" class="icon-btn" data-sidebar-toggle aria-controls="sidebar"
                    aria-label="Close sidebar" title="Close sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="16" rx="2" />
                        <path d="M9 4v16" />
                        <path d="M15 10l-2 2 2 2" />
                    </svg>
                </button>
            </div>

            <button type="button" id="new-chat-btn" class="btn btn-outline btn-block">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                New chat
            </button>

            <div class="sidebar-section">
                <div class="section-title">
                    <span>Models</span>
                    <span class="section-meta" id="model-count" aria-live="polite"></span>
                </div>

                <div class="search-field">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-3.5-3.5" />
                    </svg>
                    <input type="search" id="model-search" placeholder="Search models" autocomplete="off"
                        aria-label="Search models" />
                    <kbd class="search-kbd">Ctrl K</kbd>
                </div>

                <div class="filter-row">
                    <label for="platform-select" class="visually-hidden">Provider</label>
                    <select id="platform-select" class="select">
                        <option value="">All providers</option>
                    </select>
                    <button type="button" id="filters-reset" class="link-btn" hidden>Reset</button>
                </div>

                <div class="chips" id="capability-chips" role="group" aria-label="Filter by capability"></div>
            </div>

            <ul id="model-list" class="model-list" role="listbox" aria-label="Available models"></ul>

            <p class="sidebar-footer">Powered by <a href="https://puter.com" target="_blank" rel="noopener">Puter.js</a></p>
        </aside>

        <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

        <!-- Main: chat -->
        <main class="chat-section">
            <header class="header">
                <button type="button" class="icon-btn header-menu" data-sidebar-toggle aria-controls="sidebar"
                    aria-label="Toggle sidebar" title="Toggle sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="16" rx="2" />
                        <path d="M9 4v16" />
                    </svg>
                </button>

                <button type="button" id="current-model" class="model-pill">
                    <span class="model-pill-dot" aria-hidden="true"></span>
                    <span id="current-model-name">Select a model</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="m6 9 6 6 6-6" />
                    </svg>
                </button>

                <div class="header-actions">
                    <button type="button" id="clear-chat-btn" class="icon-btn" aria-label="Clear conversation"
                        title="Clear conversation">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 6h18" />
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                        </svg>
                    </button>
                    <button type="button" id="theme-toggle" class="icon-btn theme-toggle-btn" aria-label="Toggle theme"
                        title="Toggle theme">
                        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                        </svg>
                        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="4" />
                            <path
                                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                        </svg>
                    </button>
                </div>
            </header>

            <div class="response-display" id="response-display">
                <section class="empty-state" id="empty-state">
                    <div class="empty-mark" aria-hidden="true">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" />
                        </svg>
                    </div>
                    <h1>What can I help you with?</h1>
                    <p>Pick a model from the sidebar, then start chatting, or switch to Image or Speech mode below.</p>

                    <div class="suggestions">
                        <button type="button" class="suggestion" data-mode="chat"
                            data-suggestion="Explain how transformers work in large language models, in simple terms.">
                            <strong>Explain a concept</strong>
                            <span>How do transformers work in LLMs?</span>
                        </button>
                        <button type="button" class="suggestion" data-mode="chat"
                            data-suggestion="Write a JavaScript function that debounces another function, with comments.">
                            <strong>Write code</strong>
                            <span>A debounce function in JavaScript</span>
                        </button>
                        <button type="button" class="suggestion" data-mode="image"
                            data-suggestion="A cozy reading nook by a rainy window, warm lamp light, watercolor style">
                            <strong>Generate an image</strong>
                            <span>A cozy reading nook on a rainy day</span>
                        </button>
                        <button type="button" class="suggestion" data-mode="speech"
                            data-suggestion="Welcome to the LLM Playground. Pick a model and start exploring.">
                            <strong>Text to speech</strong>
                            <span>Hear a short welcome message</span>
                        </button>
                    </div>
                </section>

                <div class="message-list" id="message-list" aria-live="polite" hidden></div>
            </div>

            <button type="button" id="scroll-bottom-btn" class="scroll-bottom-btn" aria-label="Scroll to latest"
                hidden>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M12 5v14M19 12l-7 7-7-7" />
                </svg>
            </button>

            <div class="input-section">
                <div class="composer">
                    <label for="prompt-input" class="visually-hidden">Message</label>
                    <textarea id="prompt-input" placeholder="Message the model…" rows="1"></textarea>

                    <div class="composer-bar">
                        <div class="mode-switch" role="group" aria-label="Mode">
                            <button type="button" class="mode-btn" data-mode="chat" aria-pressed="true">Chat</button>
                            <button type="button" class="mode-btn" data-mode="image" aria-pressed="false">Image</button>
                            <button type="button" class="mode-btn" data-mode="speech"
                                aria-pressed="false">Speech</button>
                        </div>

                        <div class="send-buttons">
                            <button type="button" id="mic-btn" class="icon-btn" aria-label="Dictate with microphone"
                                aria-pressed="false" title="Dictate">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                    aria-hidden="true">
                                    <rect x="9" y="2" width="6" height="12" rx="3" />
                                    <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4" />
                                </svg>
                            </button>
                            <button type="button" id="stop-btn" class="send-btn send-btn--stop" aria-label="Stop generating"
                                title="Stop" hidden>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                    <rect x="5" y="5" width="14" height="14" rx="2" />
                                </svg>
                            </button>
                            <button type="button" id="submit-btn" class="send-btn" aria-label="Send" title="Send"
                                disabled>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                                    aria-hidden="true">
                                    <path d="M12 19V5M5 12l7-7 7 7" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <p class="composer-hint" id="composer-hint">Enter to send · Shift+Enter for a new line</p>
            </div>
        </main>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
</body>

</html>
